name: Build and Release .mrpack
on:
  push:
    branches: [ "main" ]

# This permission is required so the Action can automatically create a Release
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21.0'

      - name: Install Packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Export Modpack
        run: ~/go/bin/packwiz modrinth export

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modpack Update v1.0.${{ github.run_number }}
          body: "Automated modpack build generated by Packwiz."
          files: "*.mrpack"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}